<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PREDIKTA351 PANEL</title>
  <style>
    :root {
      --bg-color: #0b0101;
      --card-bg: rgba(90, 0, 0, 0.08);
      --card-border: rgba(180, 0, 0, 0.35);
      --red-main: #b80000;
      --red-light: #ff4d4d;
      --red-glow: rgba(180, 0, 0, 0.55);
      --text-color: #ffd8d8;
      --text-dim: #995555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #330202, var(--bg-color));
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(180, 0, 0, 0.15);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      font-size: 0.8rem;
      color: var(--red-light);
      margin-bottom: 0.75rem;
      box-shadow: 0 0 18px var(--red-glow);
    }

    .ai-badge span {
      width: 8px;
      height: 8px;
      background: var(--red-main);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--red-main);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.75; }
      50% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 14px var(--red-main); }
      100% { transform: scale(0.95); opacity: 0.75; }
    }

    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #ffffff, #ff7070, var(--red-main));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .config-control {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(18px);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: 0 10px 32px rgba(0,0,0,0.6);
    }

    .config-control label {
      font-size: 0.85rem;
      color: var(--red-light);
      font-weight: 600;
    }

    .config-control input {
      width: 100%;
      background: rgba(20, 0, 0, 0.6);
      border: 1px solid rgba(180, 0, 0, 0.45);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #ffecec;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.22s, box-shadow 0.22s;
    }

    .config-control input:focus {
      border-color: var(--red-main);
      box-shadow: 0 0 12px var(--red-glow);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1100px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(18px);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 8px 34px 0 rgba(0, 0, 0, 0.42);
      transition: all 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--red-main);
      box-shadow: 0 14px 44px rgba(180, 0, 0, 0.28);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .badge {
      background: rgba(180, 0, 0, 0.18);
      color: var(--red-light);
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(180, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.15rem;
      color: #fff;
      font-weight: 700;
    }

    .code-box {
      background: rgba(15, 0, 0, 0.6);
      border: 1px solid rgba(120, 0, 0, 0.25);
      border-radius: 10px;
      padding: 0.85rem;
      font-family: monospace;
      font-size: 0.78rem;
      color: var(--red-light);
      word-break: break-all;
      margin-bottom: 1rem;
      max-height: 90px;
      overflow-y: auto;
      line-height: 1.4;
      user-select: all;
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.22s ease;
      font-size: 0.85rem;
    }

    .btn-copy {
      background: linear-gradient(135deg, #990000, #ff1a1a);
      color: #fff;
      box-shadow: 0 4px 16px rgba(180, 0, 0, 0.4);
    }

    .btn-copy:hover {
      opacity: 0.88;
      box-shadow: 0 7px 22px rgba(180, 0, 0, 0.62);
    }

    footer {
      margin-top: auto;
      padding-top: 3rem;
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
    }

    #toast-notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #5c0000, #b80000);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 10px 32px rgba(0,0,0,0.65);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.32s ease;
      opacity: 0;
      z-index: 1000;
      text-align: center;
      border: 1px solid rgba(255, 80, 80, 0.4);
    }

    #toast-notification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="ai-badge">
      <span></span> PREDIKTA351 Core Active
    </div>
    <h1>PREDIKTA351 PANEL</h1>
    <p>Dynamic Secure Tunnel Endpoints (WebSocket‑Only)</p>
  </header>

  <div class="config-control">
    <label for="dynamicHost">Dynamic Host / Server Domain (Automatic):</label>
    <input type="text" id="dynamicHost" value="" oninput="updateConfigs()" />
  </div>

  <main class="grid">
    <div class="card">
      <div class="card-header">
        <h2>Trojan</h2>
        <span class="badge">WebSocket</span>
      </div>
      <div class="code-box" id="boxTrojanWs"></div>
      <div class="btn-group">
        <button class="btn btn-copy" onclick="copyConfig('boxTrojanWs')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>VLESS</h2>
        <span class="badge">WebSocket</span>
      </div>
      <div class="code-box" id="boxVlessWs"></div>
      <div class="btn-group">
        <button class="btn btn-copy" onclick="copyConfig('boxVlessWs')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>VMess</h2>
        <span class="badge">WebSocket</span>
      </div>
      <div class="code-box" id="boxVmessWs"></div>
      <div class="btn-group">
        <button class="btn btn-copy" onclick="copyConfig('boxVmessWs')">Copy Config</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Shadowsocks</h2>
        <span class="badge">WebSocket</span>
      </div>
      <div class="code-box" id="boxSsWs"></div>
      <div class="btn-group">
        <button class="btn btn-copy" onclick="copyConfig('boxSsWs')">Copy Config</button>
      </div>
    </div>
  </main>

  <footer>
    &copy; PREDIKTA351 System &bull; All Rights Reserved
  </footer>

  <div id="toast-notification">✅PREDIKTA351✅<br>🫰Na Copy Na Ang Config👌</div>

  <script>
    const newUuid = "92c4d760-71b2-4127-9e88-d35a7c2f18b9";
    const pathTr = "/tr-PREDIKTA-351";
    const pathVl = "/vl-PREDIKTA351";
    const pathVm = "/vm-PREDIKTA351";
    const pathSs = "/ss-PREDIKTA351";
    const trojanPass = "PREDIKTA-351";

    function updateConfigs() {
      const host = document.getElementById('dynamicHost').value;
      document.getElementById('boxTrojanWs').innerText =
        "trojan://" + trojanPass + "@" + host + ":443?type=ws&host=" + host + "&headerType=none&path=" + encodeURIComponent(pathTr) + "&security=tls&sni=" + host + "#PREDIKTA351-Trojan-WS";

      document.getElementById('boxVlessWs').innerText =
        "vless://" + newUuid + "@" + host + ":443?encryption=none&type=ws&host=" + host + "&headerType=none&path=" + encodeURIComponent(pathVl) + "&security=tls&sni=" + host + "#PREDIKTA351-VLESS-WS";

      const obj = {
        "add": host,
        "port": "443",
        "id": newUuid,
        "aid": "0",
        "scy": "chacha20-poly1305",
        "net": "ws",
        "type": "none",
        "host": host,
        "path": pathVm,
        "tls": "tls",
        "sni": host,
        "ps": "PREDIKTA351-VMESS-WS",
        "v": "2"
      };
      document.getElementById('boxVmessWs').innerText = "vmess://" + btoa(JSON.stringify(obj));

      document.getElementById('boxSsWs').innerText =
        "ss://Y2hhY2hhMjAtaWV0Zi1wb2x5MTMwNTpQUkVESUtUQS0zNTE=@" + host + ":443?type=ws&host=" + host + "&headerType=none&path=" + encodeURIComponent(pathSs) + "&security=tls&sni=" + host + "#PREDIKTA351-Shadowsocks-WS";
    }

    function copyConfig(elementId) {
      const text = document.getElementById(elementId).innerText;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast();
        }).catch(err => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        showToast();
      } catch (err) {
        alert("Dili ma-copy automatic. Palihog i-manual select.");
      }
      document.body.removeChild(textarea);
    }

    function showToast() {
      const toast = document.getElementById('toast-notification');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    window.onload = function() {
      const currentHost = window.location.host;
      if (currentHost) {
        document.getElementById('dynamicHost').value = currentHost;
      }
      updateConfigs();
    };
  </script>
</body>
</html>
