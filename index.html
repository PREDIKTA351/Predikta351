<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Con Fig Neural Panel</title>
  <style>
    :root {
      --bg-color: #060202;
      --card-bg: rgba(139, 0, 0, 0.04);
      --card-border: rgba(220, 20, 60, 0.25);
      --bloody-red: #dc143c;
      --bloody-light: #ff6b6b;
      --bloody-glow: rgba(220, 20, 60, 0.35);
      --text-color: #f3f4f6;
      --text-dim: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #2a0808, var(--bg-color));
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(220, 20, 60, 0.12);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      font-size: 0.8rem;
      color: var(--bloody-light);
      margin-bottom: 0.75rem;
      box-shadow: 0 0 15px var(--bloody-glow);
    }

    .ai-badge span {
      width: 8px;
      height: 8px;
      background: var(--bloody-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--bloody-red);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--bloody-red); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #ffffff, var(--bloody-light), var(--bloody-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .config-control {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .config-control label {
      font-size: 0.85rem;
      color: var(--bloody-light);
      font-weight: 600;
    }

    .config-control input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(220, 20, 60, 0.4);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .config-control input:focus {
      border-color: var(--bloody-red);
      box-shadow: 0 0 10px var(--bloody-glow);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1100px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--bloody-red);
      box-shadow: 0 12px 40px rgba(220, 20, 60, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .badge {
      background: rgba(220, 20, 60, 0.15);
      color: var(--bloody-light);
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(220, 20, 60, 0.3);
    }

    .card h2 {
      font-size: 1.15rem;
      color: #fff;
      font-weight: 700;
    }

    .code-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 0.85rem;
      font-family: monospace;
      font-size: 0.78rem;
      color: var(--bloody-light);
      word-break: break-all;
      margin-bottom: 1rem;
      max-height: 90px;
      overflow-y: auto;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .btn-copy {
      background: linear-gradient(135deg, #dc143c, #8b0000);
      color: #fff;
      box-shadow: 0 4px 15px rgba(220, 20, 60, 0.35);
    }

    .btn-copy:hover {
      opacity: 0.9;
      box-shadow: 0 6px 20px rgba(220, 20, 60, 0.55);
    }

    footer {
      margin-top: auto;
      padding-top: 3rem;
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
    }

    #toast-notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #dc143c, #8b0000);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      opacity: 0;
      z-index: 1000;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    #toast-notification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

      }

</html>
